name: iOS & KMP Cloud Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-kmp-ios:
    name: Build KMP Shared Framework & iOS App IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build KMP Shared Framework for iOS
        run: |
          ./gradlew :shared:linkReleaseFrameworkIosArm64
          mkdir -p shared/build/xcode-frameworks/Release/iphoneos
          cp -R shared/build/bin/iosArm64/releaseFramework/shared.framework shared/build/xcode-frameworks/Release/iphoneos/

      - name: Build iOS App with Xcode
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
                     -scheme iosApp \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Package iOS App into IPA
        run: |
          mkdir -p Payload
          cp -r iosApp/build/Build/Products/Release-iphoneos/*.app Payload/
          mkdir -p Payload/*.app/Frameworks
          if [ -d "shared/build/bin/iosArm64/releaseFramework/shared.framework" ]; then
            cp -R shared/build/bin/iosArm64/releaseFramework/shared.framework Payload/*.app/Frameworks/
          fi
          zip -r pingpin.ipa Payload

      - name: Upload iOS App IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pingpin-ios-app-ipa
          path: pingpin.ipa

      - name: Publish IPA to Latest GitHub Release (v3.0.0)
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v3.0.0 pingpin.ipa --clobber
