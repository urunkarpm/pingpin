name: iOS & KMP Cloud Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-kmp-ios:
    name: Build KMP Shared Framework, iOS App & Android Baseline
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build KMP Shared Framework for iOS & Android
        run: ./gradlew :shared:assemble

      - name: Build Android Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build iOS App with Xcode
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
                     -scheme iosApp \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Package iOS App into IPA
        run: |
          mkdir -p Payload
          cp -r iosApp/build/Build/Products/Release-iphoneos/iosApp.app Payload/
          zip -r pingpin.ipa Payload

      - name: Upload iOS App IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pingpin-ios-app-ipa
          path: pingpin.ipa

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pingpin-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload KMP Shared AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pingpin-shared-aar
          path: shared/build/outputs/aar/shared-debug.aar

      - name: Publish IPA to Latest GitHub Release (v3.0.0)
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v3.0.0 pingpin.ipa --clobber
