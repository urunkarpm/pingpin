name: pingpin
description: "PingPin - Local-only attendance app with WiFi + Geolocation verification"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^14.2.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.3
  path: ^1.9.0
  geolocator: ^13.0.1
  permission_handler: ^11.3.0
  network_info_plus: ^6.0.1
  connectivity_plus: ^6.0.3
  table_calendar: ^3.1.1
  pdf: ^3.10.8
  printing: ^5.12.0
  intl: ^0.19.0
  workmanager: ^0.9.0
  background_fetch: ^1.3.2
  image_picker: ^1.0.7
  flutter_local_notifications: ^17.2.1+2
  timezone: ^0.9.2
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  drift_dev: ^2.18.0
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "logo.png"
  min_sdk_android: 21


flutter:
  uses-material-design: true
  assets:
    - logo.png
